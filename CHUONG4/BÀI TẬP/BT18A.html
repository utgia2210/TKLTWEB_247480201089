<!DOCTYPE html>
<html>
<head>
    <title>Bt4,18a</title>
    <meta charset="utf-8">
</head>

<script>
    function KiemTra(){
        const noiDung = document.getElementsByName("NoiDung")[0];
        const soKyTu = document.getElementsByName("SoKyTu")[0];

        if(noiDung.value.length > 1000) {
            alert("Bạn đã gõ quá số ký tự cho phép!");
            noiDung.value = noiDung.value.substring(0, 200);
        }

        soKyTu.value = noiDung.value.length;
    }
</script>

<body style="font-family: Arial; font-size: 30  px;">

    Số ký tự đã gõ:
    <input type="text" name="SoKyTu" readonly style="font-size: 12px;">
    <br>

    <textarea 
        name="NoiDung"
        cols="100"
        rows="20"
        onkeyup="KiemTra();"
        style="font-size: 20px;">
    </textarea>

</body>
</html>
