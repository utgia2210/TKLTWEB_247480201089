<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var x=prompt("Nhap gia tri x=");
        document.write(x);
        do{
            document.write(x);
            x--;
        }while(x>0)
        if(x<0){
            document.write("Vui long nhap lai gia tri:");
            document.write(x);
        }
    </script>
</body>
</html>
