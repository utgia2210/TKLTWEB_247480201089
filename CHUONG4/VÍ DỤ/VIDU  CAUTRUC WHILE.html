<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>

<body>
    <script>
        var x=prompt("Nhap gia tri x:");
        document.write(x);
        while(x>0)
    {
        document.write(x);
        x--;
    }
    if(x<0){
        document.write("Vui long nhap lai:");
        document.write(x);
        }
    </script>
</body>
