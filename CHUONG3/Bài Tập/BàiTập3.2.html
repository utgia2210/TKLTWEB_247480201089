<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Trang web của tôi(Baitap3.2)</title>

    <style>
        h2 {
            font-size: 24px;
            color: #040404;
            background-color: #e60b0b;
        }

        p.doan-1 {
            font-size: 14pt;
            /*font family thì chọn font chữ*/
            font-family: "Times New Roman", Times, serif;
            /*font style là chọn kiểu chữ(in đậm, nghiêng....)*/
            font-style: italic;
            background-color: #12bac3;
            color: #ffffff;
        }

        p.doan-2 {
            font-size: 14pt;
            font-family: "Times New Roman", Times, serif;
            font-style: italic;
            background-color: #dc8f0a;
            color: #d4d114;
        }
    </style>
</head>

<body>

    <h2>QUÊ HƯƠNG</h2>

    <p class="doan-1">
        Quê hương là chùm khế ngọt<br />
        Cho con chèo hái mỗi ngày <br />
        Quê hương là con diêu biết<br />
        Tuổi thơ con thả trên dồng<br />
    </p>

    <p class="doan-2">
        Quê hương là cầu tre nhỏ<br/>
        Mẹ về nón lá nghiêng che<br/>
        Quê hương mỗi người chỉ một<br/>
        Như là chỉ một mẹ thôi<br/>
    </p>

</body>
</html>
